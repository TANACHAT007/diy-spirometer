<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spiro Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Prompt:wght@400;500;600&display=swap">
<style>
/* Soft 3D-animation look, same system as the product page: puffy cards, pastel KPI tiles, clay highlights. */
:root{--bg:#f3f8ff;--card:#fff;--ink:#1e3250;--mute:#5f7694;--acc:#3f97e8;--ok:#2fbf8a;--warn:#f0a73a;--bad:#ff6f7d;--line:#dbe8f7;
  --sky:#6cb8f6;--mint:#7fdcc0;--peach:#ffb59a;--lilac:#c3b5ff;--sun:#ffd776;
  --pop:0 2px 0 rgba(255,255,255,.9) inset,0 -3px 0 rgba(63,151,232,.10) inset,0 16px 30px -16px rgba(53,110,180,.45);
  --disp:"Fredoka","Prompt",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2e;--card:#1a2b45;--ink:#eaf3ff;--mute:#9db4d1;--acc:#74bfff;--line:#2a4163;
  --pop:0 2px 0 rgba(255,255,255,.07) inset,0 -3px 0 rgba(0,0,0,.18) inset,0 16px 30px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1b2e;--card:#1a2b45;--ink:#eaf3ff;--mute:#9db4d1;--acc:#74bfff;--line:#2a4163;
  --pop:0 2px 0 rgba(255,255,255,.07) inset,0 -3px 0 rgba(0,0,0,.18) inset,0 16px 30px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.6 "Prompt","Fredoka",system-ui,sans-serif;
  background:radial-gradient(800px 420px at 0% -5%,rgba(108,184,246,.25),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(195,181,255,.22),transparent 60%),var(--bg);background-color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;gap:10px;align-items:center;padding:16px 0;flex-wrap:wrap;max-width:980px;margin:0 auto}
h1{font:700 22px var(--disp);margin:0 auto 0 0}
button,input,select{font:inherit;border:0;background:var(--card);color:var(--ink);border-radius:99px;padding:9px 16px;box-shadow:var(--pop)}
input{border-radius:18px;width:100%;box-shadow:0 0 0 2px var(--line) inset}
button{cursor:pointer;font-weight:500}
button.pri{background:linear-gradient(#7cc4ff,#3f97e8);color:#fff;font:600 15px var(--disp);box-shadow:0 2px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(0,0,0,.1) inset,0 10px 18px -8px rgba(63,151,232,.7)}
main{max-width:980px;margin:0 auto;padding:0 0 44px;display:grid;gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border-radius:30px;padding:18px 20px;box-shadow:var(--pop)}
.grid .card:nth-child(7n+1){background:linear-gradient(160deg,#fff,#dff0ff)}.grid .card:nth-child(7n+2){background:linear-gradient(160deg,#fff,#dcf7ee)}
.grid .card:nth-child(7n+3){background:linear-gradient(160deg,#fff,#ffe8df)}.grid .card:nth-child(7n+4){background:linear-gradient(160deg,#fff,#ebe5ff)}
.grid .card:nth-child(7n+5){background:linear-gradient(160deg,#fff,#fff1cc)}.grid .card:nth-child(7n+6){background:linear-gradient(160deg,#fff,#dff0ff)}
.grid .card:nth-child(7n){background:linear-gradient(160deg,#fff,#dcf7ee)}
:root[data-theme=dark] .grid .card{background:var(--card)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .grid .card{background:var(--card)}}
.k{color:var(--mute);font-size:12px}.v{font:600 32px var(--disp)}.u{font:500 13px "Prompt",sans-serif;color:var(--mute)}
canvas{width:100%;height:230px;display:block}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:9px 10px;border-bottom:2px solid var(--bg)}th:first-child,td:first-child{text-align:left}
.tag{padding:3px 12px;border-radius:99px;font-size:12px;color:#fff;font-weight:600}
#cfg{display:none;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#cfg label{display:grid;gap:4px;font-weight:500;color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:12px}
</style>

</head>
<body>
<header>
  <h1 id="t_title">Spiro Dashboard</h1>
  <select id="role"><option value="patient">ผู้ป่วย / Patient</option><option value="doctor">ครู-แพทย์ / Doctor</option></select>
  <button id="lang">TH/EN</button><button id="theme">◐</button><button id="gear">⚙</button>
</header>
<main>
  <section class="card" id="cfg">
    <label>Firebase RTDB URL<input id="c_db" placeholder="https://xxxx-default-rtdb.firebaseio.com"></label>
    <label>Device ID<input id="c_dev" placeholder="spiro-01"></label>
    <label>Auth (optional)<input id="c_auth" type="password"></label>
    <label>Predicted FEV1 (L) — personal ref<input id="c_pred" type="number" step="0.1" placeholder="3.5"></label>
    <div><button class="pri" id="save">Save</button> <button id="demo">ลองโหมดตัวอย่าง / Demo data</button></div>
  </section>
  <div class="grid" id="kpis"></div>
  <section class="card"><div class="k" id="t_trend">แนวโน้ม FEV1 / FVC</div><canvas id="chart"></canvas></section>
  <section class="card"><div class="k" id="t_hist">ประวัติการเป่า</div>
    <div style="overflow:auto"><table id="tbl"></table></div>
    <p><button id="csv">Copy CSV</button> <span class="note" id="status"></span></p>
  </section>
  <p class="note" id="demoNote" hidden>ข้อมูลตัวอย่างที่สร้างขึ้นเพื่อแสดงหน้าจอ ไม่ใช่ผลของคนจริง / Example data only</p>
  <p class="note" id="t_disc"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const T={th:{title:'สไปโรมิเตอร์ IoT',trend:'แนวโน้ม FEV1 / FVC (ลิตร)',hist:'ประวัติการเป่า',time:'เวลา',last:'ล่าสุด',n:'จำนวนครั้ง',best:'ดีที่สุด (FEV1)',
  disc:'เครื่องมือเพื่อการเรียนรู้/คัดกรองเบื้องต้น ไม่ใช่เครื่องมือแพทย์ที่ผ่านการรับรอง — ค่าที่ผิดปกติให้ปรึกษาแพทย์',
  ok:'ปกติ',lo:'ต่ำ',vlo:'ต่ำมาก',nodata:'ยังไม่มีข้อมูล — เป่าที่เครื่องหรือตรวจการตั้งค่า ⚙',bat:'แบตเตอรี่',obs:'ขณะนี้ลักษณะ: อัตราส่วน FEV1/FVC <70% อาจเข้าได้กับการอุดกั้น'},
 en:{title:'IoT Spirometer',trend:'FEV1 / FVC trend (L)',hist:'Breath history',time:'Time',last:'Latest',n:'Tests',best:'Best FEV1',
  disc:'Learning / screening aid, not a certified medical device — consult a clinician for abnormal values.',
  ok:'Normal',lo:'Low',vlo:'Very low',nodata:'No data yet — blow on the device or check ⚙ settings',bat:'Battery',obs:'FEV1/FVC < 70% may indicate obstruction'}};
let lang=localStorage.lang||'th',cfg=JSON.parse(localStorage.cfg||'{}'),rows=[];
const tt=k=>T[lang][k];
function applyText(){document.documentElement.lang=lang;$('t_title').textContent=tt('title');$('t_trend').textContent=tt('trend');$('t_hist').textContent=tt('hist');$('t_disc').textContent=tt('disc');render()}
function stat(r){const p=+cfg.pred||0,ratio=r.ratio;let c='var(--ok)',s=tt('ok');
  if(ratio<70||(p&&r.fev1<0.8*p)){c='var(--warn)';s=tt('lo')}
  if(ratio<50||(p&&r.fev1<0.5*p)){c='var(--bad)';s=tt('vlo')}
  return `<span class="tag" style="background:${c}">${s}</span>`}
function kpi(k,v,u){return `<div class="card"><div class="k">${k}</div><div class="v">${v}<span class="u"> ${u||''}</span></div></div>`}
function render(){
  const k=$('kpis');
  if(!rows.length){k.innerHTML='';$('tbl').innerHTML='';$('status').textContent=tt('nodata');draw();return}
  const l=rows[rows.length-1],best=Math.max(...rows.map(r=>r.fev1));
  k.innerHTML=kpi('FEV1',l.fev1.toFixed(2),'L')+kpi('FVC',l.fvc.toFixed(2),'L')+kpi('FEV1/FVC',l.ratio.toFixed(0),'%')+kpi('PEF',l.pef.toFixed(1),'L/s')+
   kpi(tt('n'),rows.length)+kpi(tt('best'),best.toFixed(2),'L')+kpi(tt('bat'),(l.bat??'-'),'%');
  let h=`<tr><th>${tt('time')}</th><th>FEV1</th><th>FVC</th><th>%</th><th>PEF</th><th></th></tr>`;
  for(const r of rows.slice().reverse().slice(0,50))h+=`<tr><td>${new Date(r.ts).toLocaleString(lang==='th'?'th-TH':'en-GB')}</td><td>${r.fev1.toFixed(2)}</td><td>${r.fvc.toFixed(2)}</td><td>${r.ratio.toFixed(0)}</td><td>${r.pef.toFixed(1)}</td><td>${stat(r)}</td></tr>`;
  $('tbl').innerHTML=h;draw()}
function draw(){
  const c=$('chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const css=getComputedStyle(document.documentElement),ink=css.getPropertyValue('--mute'),acc=css.getPropertyValue('--acc');
  if(!rows.length)return;const d=rows.slice(-30),mx=Math.max(1,...d.map(r=>Math.max(r.fvc,r.fev1)))*1.1,P=28;
  g.strokeStyle=css.getPropertyValue('--line');g.fillStyle=ink;g.font='11px system-ui';
  for(let i=0;i<=4;i++){const y=h-P-(h-2*P)*i/4;g.beginPath();g.moveTo(P,y);g.lineTo(w-8,y);g.stroke();g.fillText((mx*i/4).toFixed(1),2,y+4)}
  const X=i=>P+(w-P-12)*(d.length>1?i/(d.length-1):.5),Y=v=>h-P-(h-2*P)*v/mx;
  for(const [key,col] of [['fvc','#7fdcc0'],['fev1',acc]]){g.strokeStyle=col;g.lineWidth=2;g.beginPath();
    d.forEach((r,i)=>i?g.lineTo(X(i),Y(r[key])):g.moveTo(X(i),Y(r[key])));g.stroke();
    g.fillStyle=col;d.forEach((r,i)=>{g.beginPath();g.arc(X(i),Y(r[key]),3,0,7);g.fill()})}
  g.fillStyle='#7fdcc0';g.fillText('FVC',w-80,12);g.fillStyle=acc;g.fillText('FEV1',w-45,12)}
let demo=false;
function makeDemo(){const out=[];let t=Date.now()-9*864e5;
  for(let i=0;i<10;i++){const fvc=3.9+Math.sin(i*1.3)*.25+i*.03,fev=fvc*(.8+Math.cos(i)*.03);
    out.push({ts:t+i*864e5,fvc:+fvc.toFixed(2),fev1:+fev.toFixed(2),ratio:+(100*fev/fvc).toFixed(1),pef:+(8+Math.sin(i)*.9).toFixed(1),bat:90-i*3})}
  return out}
async function load(){
  if(demo){rows=makeDemo();$('status').textContent='demo';$('demoNote').hidden=false;render();return}
  $('demoNote').hidden=true;
  if(!cfg.db||!cfg.dev){$('status').textContent=tt('nodata');$('cfg').style.display='grid';return}
  try{const u=`${cfg.db.replace(/\/$/,'')}/devices/${encodeURIComponent(cfg.dev)}/sessions.json`+(cfg.auth?`?auth=${cfg.auth}`:'');
    const j=await (await fetch(u)).json();
    rows=Object.values(j||{}).filter(r=>r&&typeof r.fev1==='number').sort((a,b)=>a.ts-b.ts);
    $('status').textContent=new Date().toLocaleTimeString()+' ✔';
  }catch(e){$('status').textContent='offline: '+e.message}
  render()}
$('demo').onclick=()=>{demo=true;$('cfg').style.display='none';load()};
$('save').onclick=()=>{demo=false;cfg={db:$('c_db').value.trim(),dev:$('c_dev').value.trim(),auth:$('c_auth').value.trim(),pred:$('c_pred').value};
  localStorage.cfg=JSON.stringify(cfg);$('cfg').style.display='none';load()};
$('gear').onclick=()=>{const s=$('cfg').style;s.display=s.display==='grid'?'none':'grid'};
$('lang').onclick=()=>{lang=lang==='th'?'en':'th';localStorage.lang=lang;applyText()};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'':'dark';localStorage.th=r.dataset.theme;draw()};
$('role').onchange=()=>{$('gear').style.display=$('role').value==='doctor'?'':'none'};
$('csv').onclick=async()=>{const t='time,fev1_L,fvc_L,ratio_pct,pef_Lps,bat
'+rows.map(r=>[new Date(r.ts).toISOString(),r.fev1,r.fvc,r.ratio,r.pef,r.bat??''].join(',')).join('
');
  try{await navigator.clipboard.writeText(t);$('status').textContent='copied CSV ✔'}catch(e){window.prompt&&0;$('status').textContent='copy blocked'}};
if(localStorage.th)document.documentElement.dataset.theme=localStorage.th;
$('c_db').value=cfg.db||'';$('c_dev').value=cfg.dev||'';$('c_auth').value=cfg.auth||'';$('c_pred').value=cfg.pred||'';
$('role').onchange();applyText();load();setInterval(load,5000);addEventListener('resize',draw);
</script>
</body>
</html>
