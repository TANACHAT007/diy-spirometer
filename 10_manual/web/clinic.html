<html lang="th">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5cab">
<title>Spiro Clinic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14263d;--mute:#586b82;--acc:#0b5cab;--acc2:#e8f1fb;--line:#d3dce7;--ok:#1b8a4b;--warn:#b7791f;--bad:#c0392b;--soft:#f5f8fc;--sh:0 1px 2px rgba(20,38,61,.06),0 8px 24px -12px rgba(20,38,61,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1621;--card:#16222f;--ink:#e8eef5;--mute:#93a4b8;--acc:#5aa8f0;--acc2:#1b2d42;--line:#2a3a4c;--ok:#3ccf7b;--warn:#e0a63a;--bad:#ef6a5b;--soft:#1b2a3a;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0e1621;--card:#16222f;--ink:#e8eef5;--mute:#93a4b8;--acc:#5aa8f0;--acc2:#1b2d42;--line:#2a3a4c;--ok:#3ccf7b;--warn:#e0a63a;--bad:#ef6a5b;--soft:#1b2a3a;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#0b5cab;color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-right:auto}
.brand i{width:24px;height:24px;border:2px solid #fff;border-radius:7px;background:linear-gradient(#fff,#fff) center/6px 70% no-repeat,linear-gradient(#fff,#fff) center/70% 6px no-repeat}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.tbtn{background:transparent;border:0;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;opacity:.85}
nav button.on{background:rgba(255,255,255,.18);opacity:1}
.tbtn{border:1px solid rgba(255,255,255,.4);padding:6px 11px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.note{color:var(--mute);font-size:12.5px}
.b{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.b:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.big{padding:14px 22px;font-size:17px;border-radius:10px}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
label{display:grid;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1 1 120px;padding:9px 12px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);display:flex;gap:8px;align-items:center}
.step b{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:12px}
.step.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}.step.on b{background:var(--acc);color:#fff}
.step.done b{background:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);background:var(--soft);font-weight:600;text-align:right}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--acc2)}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--soft)}
.tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;background:var(--mute)}
.tag.ok{background:var(--ok)}.tag.warn{background:var(--warn)}.tag.bad{background:var(--bad)}
.chk{display:grid;gap:8px}.chk label{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px;font-weight:500;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.chk input{width:18px;height:18px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.kpi{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:8px 12px;background:var(--card)}
.kpi b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}.kpi span{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.interp{border-left:5px solid var(--ok);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0}.interp.warn{border-color:var(--warn)}.interp.bad{border-color:var(--bad)}
.interp b{font-size:16px}.interp p{margin:4px 0 0;color:var(--mute);font-size:13.5px}
.alert{padding:9px 13px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-size:13.5px}
.alert.warn{border-color:var(--warn)}.alert.bad{border-color:var(--bad)}.alert.ok{border-color:var(--ok)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.16);font-size:12.5px}
.pill i{width:8px;height:8px;border-radius:50%;background:#f0b429}.pill.on i{background:#4ade80}
.empty{padding:28px;text-align:center;color:var(--mute)}
.coach{position:fixed;inset:0;background:#0b3a6e;color:#fff;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.coach.on{display:flex}
.coach .msg{font-size:clamp(28px,6vw,56px);font-weight:700}.coach .sub{font-size:clamp(16px,2.5vw,24px);opacity:.85}
.coach .bar2{width:min(720px,90%);height:34px;border-radius:17px;background:rgba(255,255,255,.18);overflow:hidden}.coach .bar2 i{display:block;height:100%;width:0;background:#4ade80;transition:width .08s}
.coach .num{font-size:clamp(48px,10vw,110px);font-weight:700;font-variant-numeric:tabular-nums}
.rep{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:22px;max-width:820px;margin:0 auto}
.rep h1{font-size:20px;margin:0;color:#0b5cab}.rep .head{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;border-bottom:2px solid #0b5cab;padding:10px 0 12px;margin-bottom:12px}
.rep .head span{font-size:11px;text-transform:uppercase;color:#586b82;letter-spacing:.05em;display:block}.rep .head b{font-size:14px}
.rep table th{background:#f0f4f9;color:#44546a}.rep table td,.rep table th{border-bottom:1px solid #d3dce7}
.rep .interp{background:#f5f8fc}.rep .interp p{color:#44546a}.rep .note{color:#586b82}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}.sig div{border-top:1px solid #000;padding-top:4px;font-size:12px;color:#444}
#ptable th,#ptable td,#rtable th:nth-child(2),#rtable td:nth-child(2){text-align:left}#ptable th:last-child,#ptable td:last-child{text-align:right}
label.b{display:inline-block;color:var(--ink);font-size:15px}
.demoBar{display:none;background:#fff4d6;color:#5b4300;border:1px solid #e6c36b;border-radius:8px;padding:8px 14px;margin-bottom:14px;align-items:center;gap:12px;flex-wrap:wrap}.demoBar.on{display:flex}
.how{display:grid;gap:8px;text-align:left;max-width:520px;margin:14px auto;counter-reset:s}.how div{counter-increment:s;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}.how div::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.credit{text-align:center;font-size:12px;opacity:.7;padding:18px 0 28px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  header.top,.tab:not(#tab-reports),#repList,.noprint,.credit,.coach{display:none!important}
  #tab-reports{display:block!important}main{padding:0;max-width:none}
  .rep{border:0;padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="tbtn" id="homeLink" href="index.html" style="text-decoration:none"></a>
  <div class="brand"><i></i><span id="appName">Spiro Clinic</span></div>
  <nav id="nav"></nav>
  <span class="pill" id="devPill"><i></i><span id="devPillT"></span></span>
  <button class="tbtn" id="lang">TH/EN</button><button class="tbtn" id="theme">◐</button>
</div></header>
<main>
<div class="demoBar" id="demoBar"><b id="demoT"></b><button class="b" id="demoOff"></button></div>

<!-- ============ PATIENTS ============ -->
<section class="tab" id="tab-patients">
  <div class="grid2">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 id="h_plist"></h2><button class="b pri" id="newP"></button></div>
      <input id="psearch" style="margin-bottom:10px">
      <div style="overflow:auto;max-height:520px"><table id="ptable"></table></div>
    </div>
    <div class="card" id="pform">
      <h2 id="h_pform"></h2>
      <div class="form">
        <label><span id="l_hn"></span><input id="p_hn"></label>
        <label><span id="l_name"></span><input id="p_name"></label>
        <label><span id="l_sex"></span><select id="p_sex"><option value="M"></option><option value="F"></option></select></label>
        <label><span id="l_age"></span><input id="p_age" type="number" min="3" max="110"></label>
        <label><span id="l_ht"></span><input id="p_ht" type="number" min="90" max="220"></label>
        <label><span id="l_wt"></span><input id="p_wt" type="number" min="10" max="250"></label>
        <label><span id="l_smk"></span><select id="p_smk"><option value="0"></option><option value="1"></option><option value="2"></option></select></label>
        <label><span id="l_pf"></span><input id="p_pf" type="number" step="0.01" min="0"></label>
        <label><span id="l_pv"></span><input id="p_pv" type="number" step="0.01" min="0"></label>
      </div>
      <label style="margin-top:12px"><span id="l_hist"></span><textarea id="p_note" rows="2"></textarea></label>
      <p class="note" id="n_pred"></p>
      <div class="row" style="margin-top:8px"><button class="b pri" id="saveP"></button><button class="b" id="startP"></button><button class="b danger" id="delP"></button></div>
      <div id="phist" style="margin-top:16px"></div>
    </div>
  </div>
</section>

<!-- ============ TEST ============ -->
<section class="tab" id="tab-test">
  <div class="steps" id="steps"></div>
  <div class="grid2">
    <div style="display:grid;gap:16px">
      <div class="card" id="tPatient"></div>
      <div class="card" id="tPrep">
        <h2 id="h_prep"></h2>
        <div class="chk" id="chk"></div>
        <p class="note" id="n_prep"></p>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2 id="h_trials" style="margin:0"></h2><span class="note" id="trialCount"></span></div>
        <div style="overflow:auto"><table id="trialTbl"></table></div>
        <div class="row" style="margin-top:10px"><button class="b" id="manual"></button><button class="b" id="sim"></button></div>
        <p class="note" id="n_trials"></p>
      </div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2 id="h_live" style="margin:0"></h2>
          <div class="row"><button class="b pri" id="bleBtn"></button><button class="b" id="coachBtn"></button></div></div>
        <canvas id="fv" width="900" height="420" style="margin-top:10px"></canvas>
        <div class="kpis" id="liveK"></div>
        <p class="note" id="bleMsg"></p>
      </div>
      <div class="card" id="tResult"></div>
    </div>
  </div>
</section>

<!-- ============ REPORTS ============ -->
<section class="tab" id="tab-reports">
  <div class="grid2">
    <div class="card" id="repList"><h2 id="h_rlist"></h2><div style="overflow:auto;max-height:620px"><table id="rtable"></table></div>
      <div class="row" style="margin-top:12px"><button class="b" id="expJson"></button><button class="b" id="expCsv"></button><label class="b" style="display:inline-block;cursor:pointer"><span id="l_imp"></span><input id="impJson" type="file" accept=".json" hidden></label></div>
      <p class="note" id="n_priv"></p></div>
    <div id="repArea"></div>
  </div>
</section>

<!-- ============ DEVICE ============ -->
<section class="tab" id="tab-device">
  <div class="grid2">
    <div class="card"><h2 id="h_dev"></h2><div id="devInfo"></div>
      <div class="row" style="margin-top:12px"><button class="b pri" id="bleBtn2"></button></div><p class="note" id="bleMsg2"></p></div>
    <div class="card"><h2 id="h_cloud"></h2>
      <div class="form"><label>Firebase RTDB URL<input id="c_db" placeholder="https://xxxx-default-rtdb.firebaseio.com"></label>
        <label>Device ID<input id="c_dev" placeholder="spiro-01"></label><label>Auth (optional)<input id="c_auth" type="password"></label></div>
      <div class="row" style="margin-top:10px"><button class="b pri" id="saveC"></button><button class="b" id="pull"></button><a class="b" id="dashLink" href="dashboard.html" style="text-decoration:none;color:inherit"></a></div>
      <p class="note" id="n_cloud"></p><div id="cloudList"></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h2 id="h_about"></h2><p class="note" id="n_about"></p></div>
</section>
</main>

<div class="coach" id="coach">
  <div class="sub" id="coachName"></div><div class="msg" id="coachMsg"></div>
  <div class="num" id="coachNum">0.00 L</div><div class="bar2"><i id="coachBar"></i></div><div class="sub" id="coachSub"></div>
  <button class="b big" id="coachClose"></button>
</div>

<script>
const $=id=>document.getElementById(id);
/* ---------- i18n ---------- */
const D={
th:{home:'← หน้าแรก',app:'Spiro Clinic',tabs:{test:'ตรวจผู้ป่วย',patients:'ผู้ป่วย',reports:'รายงาน',device:'เครื่อง'},
 plist:'รายชื่อผู้ป่วย',newp:'+ ผู้ป่วยใหม่',search:'ค้นหา HN / ชื่อ',pform:'ข้อมูลผู้ป่วย',hn:'HN / รหัส',name:'ชื่อ-สกุล',sex:'เพศ',male:'ชาย',female:'หญิง',age:'อายุ (ปี)',ht:'ส่วนสูง (ซม.)',wt:'น้ำหนัก (กก.)',

/* ---------- pure clinical logic ---------- */
const MIN_DUR=2;                       // s, device-level acceptability (the 0.25 L/s cut-off ends healthy blows at ~2.5-4 s; ATS/ERS wants 6 s or a plateau)
function judge(tr){return tr.fvc>=0.3&&tr.dur>=MIN_DUR&&tr.quality!=='weak'}
function summarize(trials){
  const acc=trials.filter(x=>x.ok),fv=acc.map(x=>x.fvc).sort((a,b)=>b-a),fe=acc.map(x=>x.fev1).sort((a,b)=>b-a);
  const best=acc.length?{fvc:fv[0],fev1:fe[0],pef:Math.max(...acc.map(x=>x.pef))}:null;
  if(best)best.ratio=100*best.fev1/best.fvc;
  const tol=best&&best.fvc<=1?0.10:0.15;
  const rep=acc.length>=2?{dFvc:fv[0]-fv[1],dFev1:fe[0]-fe[1],ok:fv[0]-fv[1]<=tol&&fe[0]-fe[1]<=tol,tol}:null;
  return{acc:acc.length,best,rep,done:acc.length>=3&&!!rep&&rep.ok}}
function interpret(best,pt){
  const pf=+(pt&&pt.pf)||0,pc=pf?100*best.fev1/pf:0;let lvl='ok',title,sub;
  if(best.ratio<70){
    if(pf){const sev=pc>=80?t('mild'):pc>=50?t('mod'):pc>=30?t('sev'):t('vsev');lvl=pc>=80?'warn':'bad';title=t('obs')+' ('+sev+')';
      sub=L(`FEV1/FVC ${fmt(best.ratio,0)}% (< 70%) และ FEV1 ${fmt(pc,0)}% ของค่าคาดการณ์ แบ่งระดับตามแนว GOLD`,`FEV1/FVC ${fmt(best.ratio,0)}% (< 70%), FEV1 ${fmt(pc,0)}% predicted; severity bands as GOLD`)}
    else{lvl=best.ratio<50?'bad':'warn';title=t('obs');sub=L(`FEV1/FVC ${fmt(best.ratio,0)}% (< 70%) กรอกค่าคาดการณ์เพื่อประเมินระดับ`,`FEV1/FVC ${fmt(best.ratio,0)}% (< 70%). Enter predicted values to grade severity`)}
  }else{title=t('noobs');
    if(pf&&pc<80){lvl='warn';sub=L(`FEV1/FVC ${fmt(best.ratio,0)}% ปกติ แต่ FEV1 ต่ำกว่า 80% ของค่าคาดการณ์ อาจเข้าได้กับปริมาตรปอดลดลง ต้องยืนยันด้วยการตรวจปอดเต็มรูปแบบ`,`Ratio normal but FEV1 < 80% predicted; restriction cannot be excluded, confirm with full PFT`)}
    else sub=L(`FEV1/FVC ${fmt(best.ratio,0)}% (≥ 70%) เครื่องนี้ประเมินภาวะปอดจำกัดการขยายตัวไม่ได้`,`FEV1/FVC ${fmt(best.ratio,0)}% (≥ 70%). This device cannot assess restriction`)}
  return{lvl,title,sub,pc}}
function L(a,b){return lang==='th'?a:b}
/* simulated blow, for staff training only: 3-exponential volume curve; like the device it stops when flow stays < 0.25 L/s, then the tail is added */
function simBlow(pt){
  const fvc=(+(pt&&pt.pv)||3.9)*(0.94+Math.random()*0.08),j=Math.random()*0.04,pts=[];let prev=0,fev1=0,pef=0,last=0,vcut=0;
  const V=tt=>fvc*(1-(0.54+j)*Math.exp(-tt/0.22)-0.26*Math.exp(-tt/1.1)-(0.20-j)*Math.exp(-tt/2.6));
  for(let tt=0;tt<14;tt+=0.04){const v=V(tt),q=(v-prev)/0.04;prev=v;if(q>pef)pef=q;if(tt<=1.0)fev1=v;
    if(q>0.25){last=tt;vcut=v}pts.push([Math.round(tt*1000),q,v]);if(tt>1&&tt-last>1)break}
  while(pts.length&&pts[pts.length-1][0]/1000>last+0.04)pts.pop();
  return{fvc:+Math.min(fvc,vcut+0.5).toFixed(2),fev1:+fev1.toFixed(2),pef:+pef.toFixed(1),dur:+last.toFixed(1),curve:pts,src:'sim'}}

function renderPatients(){

  fillForm()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fillForm(){
  const p=P(activeP)||{};const f={p_hn:'hn',p_name:'name',p_sex:'sex',p_age:'age',p_ht:'ht',p_wt:'wt',p_smk:'smk',p_pf:'pf',p_pv:'pv',p_note:'note'};
  for(const k in f)$(k).value=p[f[k]]??(k==='p_sex'?'M':k==='p_smk'?'0':'');
  $('delP').style.display=$('startP').style.display=p.id?'':'none';
  const ts=tests.filter(x=>x.pid===p.id).sort((a,b)=>b.ts-a.ts);
  $('phist').innerHTML=p.id?`<h3>${t('sessions')}</h3>`+(ts.length?`<table><tr><th>${t('date')}</th><th>FEV1</th><th>FVC</th><th>%</th></tr>`+ts.map(x=>`<tr class="clk" data-t="${x.id}"><td>${fdate(x.ts)}</td><td>${fmt(x.best.fev1)}</td><td>${fmt(x.best.fvc)}</td><td>${fmt(x.best.ratio,0)}</td></tr>`).join('')+'</table>'+trendSvg(ts.slice().reverse()):`<p class="note">${t('none')}</p>`):'';
  $('phist').querySelectorAll('tr.clk').forEach(r=>r.onclick=()=>{repSel=r.dataset.t;setTab('reports')})}
const fdate=ts=>new Date(ts).toLocaleString(lang==='th'?'th-TH':'en-GB',{dateStyle:'short',timeStyle:'short'});
function trendSvg(ts){if(ts.length<2)return'';const w=420,h=110,mx=Math.max(...ts.map(x=>x.best.fvc))*1.1,X=i=>20+(w-30)*i/(ts.length-1),Y=v=>h-14-(h-24)*v/mx;
  const line=k=>ts.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.best[k]).toFixed(1)).join('');
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;margin-top:8px"><path d="${line('fvc')}" fill="none" stroke="#2fbf8a" stroke-width="2"/><path d="${line('fev1')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>
   <text x="22" y="12" font-size="10" fill="var(--mute)">FEV1 (blue) / FVC (green), L</text></svg>`}
$('newP').onclick=()=>{activeP='';fillForm();$('p_hn').focus()};

/* ---------- test workflow ---------- */
function startTest(pid){cur={pid,trials:[],checks:[],comment:''};live.buf=[];setTab('test')}
const CHECKS=['c1','c2','c3','c4','c5'];
function stage(){const p=P(cur.pid);if(!p)return 1;const s=summarize(cur.trials);if(s.done)return 4;if(cur.checks.length>=CHECKS.length||cur.trials.length)return 3;return 2}
function renderTest(){
  const p=P(cur.pid),st=stage();

/* ---------- flow-volume chart ---------- */
function drawFV(){
  const c=$('fv'),dpr=devicePixelRatio||1,w=c.clientWidth||600,h=Math.round(w*0.48);c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';
  const g=c.getContext('2d');g.scale(dpr,dpr);const css=getComputedStyle(document.documentElement),line=css.getPropertyValue('--line'),mute=css.getPropertyValue('--mute'),acc=css.getPropertyValue('--acc');
  const PL=40,PB=26,PT=10,PR=10,all=[...cur.trials.map(x=>x.curve||[]),live.buf],maxV=Math.max(5,...all.map(a=>a.length?a[a.length-1][2]:0))*1.05,maxF=Math.max(10,...all.map(a=>Math.max(0,...a.map(p=>p[1]))))*1.1;
  const X=v=>PL+(w-PL-PR)*v/maxV,Y=f=>h-PB-(h-PB-PT)*f/maxF;
  g.strokeStyle=line;g.fillStyle=mute;g.font='11px IBM Plex Sans Thai,sans-serif';g.lineWidth=1;
  for(let f=0;f<=maxF;f+=2){g.beginPath();g.moveTo(PL,Y(f));g.lineTo(w-PR,Y(f));g.stroke();g.fillText(f,8,Y(f)+4)}
  for(let v=0;v<=maxV;v++){g.beginPath();g.moveTo(X(v),PT);g.lineTo(X(v),h-PB);g.stroke();g.fillText(v,X(v)-3,h-8)}
  g.fillText('L/s',PL+6,PT+12);g.fillText('L',w-PR-8,h-8);
  const pal=['#2fbf8a','#f0a73a','#a06cf0','#e86f8c','#3fb8e8','#8aa04a','#d08a4a','#6a7f95'];
  cur.trials.forEach((x,i)=>{if(!x.curve)return;g.strokeStyle=pal[i%8];g.globalAlpha=x.ok?1:.35;g.lineWidth=2;g.beginPath();x.curve.forEach((p,k)=>k?g.lineTo(X(p[2]),Y(p[1])):g.moveTo(X(p[2]),Y(p[1])));g.stroke()});
  g.globalAlpha=1;if(live.buf.length&&!(cur.trials.length&&cur.trials[cur.trials.length-1].curve===live.buf)){g.strokeStyle=acc;g.lineWidth=3;g.beginPath();live.buf.forEach((p,k)=>k?g.lineTo(X(p[2]),Y(p[1])):g.moveTo(X(p[2]),Y(p[1])));g.stroke()}
  if(!all.some(a=>a.length)){g.fillStyle=mute;g.font='14px IBM Plex Sans Thai,sans-serif';g.textAlign='center';g.fillText(L('กราฟจะปรากฏเมื่อเริ่มเป่า','The curve appears when the patient blows'),w/2,h/2);g.textAlign='left'}}

/* ---------- Bluetooth (UUIDs match the firmware) ---------- */
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',LIVE_C='6e400002-b5a3-f393-e0a9-e50e24dcca9e',RES_C='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let lastT=-1;
async function connectBle(){
  const m=[$('bleMsg'),$('bleMsg2')];const say=s=>m.forEach(e=>e.textContent=s);
  if(!navigator.bluetooth){say(L('เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth หรือถูกบล็อก (ใช้ Chrome/Edge ผ่าน https)','This browser has no Web Bluetooth or it is blocked (use Chrome/Edge over https)'));return}
  try{
    const d=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}]});
    const s=await (await d.gatt.connect()).getPrimaryService(NUS);
    const cl=await s.getCharacteristic(LIVE_C),cr=await s.getCharacteristic(RES_C),dec=new TextDecoder();
    cl.addEventListener('characteristicvaluechanged',e=>{const p=dec.decode(e.target.value).split(',').map(Number);if(p.length>=3&&!p.some(isNaN)){
      if(p[0]<lastT||!live.buf.length||cur.trials.length&&live.buf===cur.trials[cur.trials.length-1].curve)live.buf=[];lastT=p[0];live.buf.push(p);coachTick(p);if(tab==='test'){renderLiveK();drawFV()}}});
    cr.addEventListener('characteristicvaluechanged',e=>{const p=dec.decode(e.target.value).split(',');if(p[0]==='R'){
      const curve=live.buf.slice(),dur=curve.length?curve[curve.length-1][0]/1000:0;
      addTrial({fvc:+p[1],fev1:+p[2],pef:+p[4],dur,curve,quality:p[5],src:'ble'});coachDone()}});
    d.addEventListener('gattserverdisconnected',()=>{live.connected=false;pill();applyBtn()});
    await cl.startNotifications();await cr.startNotifications();
    live.connected=true;live.name=d.name||'';say(L('เชื่อมต่อแล้ว: ','Connected: ')+d.name);pill();applyBtn();
  }catch(e){say(L('เชื่อมต่อไม่สำเร็จ: ','Connect failed: ')+e.message)}}
function applyBtn(){$('bleBtn').textContent=live.connected?t('connected'):t('conn');$('bleBtn2').textContent=$('bleBtn').textContent;renderDevice()}
function pill(){$('devPill').classList.toggle('on',live.connected);$('devPillT').textContent=live.connected?t('readyPill')+(live.name?' · '+live.name:''):t('offPill')}
$('bleBtn').onclick=$('bleBtn2').onclick=connectBle;

$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';localStorage.sp_th=r.dataset.theme;render()};
if(localStorage.sp_th)document.documentElement.dataset.theme=localStorage.sp_th;
addEventListener('resize',()=>{if(tab==='test')drawFV()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* example mode: made-up patients + two saved tests, never written to storage */
function enterDemo(){
  DEMO=true;patients=[{id:'d1',hn:'HN-0001',name:'ตัวอย่าง ผู้ป่วย',sex:'M',age:45,ht:170,wt:68,smk:'1',pf:3.4,pv:4.2,note:''},{id:'d2',hn:'HN-0002',name:'Example Patient',sex:'F',age:32,ht:160,wt:55,smk:'0',pf:2.9,pv:3.5,note:''}];tests=[];
  for(let k=0;k<3;k++){const trials=[];for(let j=0;j<3;j++){const b=simBlow(patients[0]);b.ok=judge(b);trials.push(b)}
    const sm=summarize(trials);tests.push({id:'t'+k,pid:'d1',ts:Date.now()-(3-k)*7*864e5,trials,best:sm.best,rep:sm.rep,comment:k===2?'ตัวอย่างความเห็นแพทย์':''})}
  activeP='d1';cur={pid:'d1',trials:[],checks:[],comment:''};live.buf=[];repSel='';
  $('demoBar').classList.add('on');render()}
$('demoOff').onclick=()=>{location.href=location.pathname};
if(/[?&]demo/.test(location.search)){enterDemo();if(/tab=(\w+)/.test(location.search))tab=RegExp.$1;if(/full/.test(location.search)){cur.trials=[];for(let k=0;k<3;k++){const b=simBlow(patients[0]);cur.trials.push({...b,ok:judge(b)})}cur.checks=CHECKS.slice();live.buf=cur.trials[2].curve}}
setTab(tab);applyText();pullCloud();
</script>
