<!doctype html>
<html lang="th">
<head>
<!-- CREDIT-STAMP: DIY IoT Spirometer - designed by Tanachat S. (TANACHAT007) / MEDTHAI - 2026 - https://github.com/TANACHAT007/diy-spirometer -->
<meta name="author" content="Tanachat S. (TANACHAT007) / MEDTHAI">


<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5cab">
<title>เข้าสู่ระบบ · Spiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14263d;--mute:#586b82;--acc:#0b5cab;--acc2:#e8f1fb;--line:#d3dce7;--ok:#1b8a4b;--warn:#b7791f;--bad:#c0392b;--soft:#f5f8fc;--sh:0 1px 2px rgba(20,38,61,.06),0 14px 34px -14px rgba(20,38,61,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1621;--card:#16222f;--ink:#e8eef5;--mute:#93a4b8;--acc:#5aa8f0;--acc2:#1b2d42;--line:#2a3a4c;--ok:#3ccf7b;--warn:#e0a63a;--bad:#ef6a5b;--soft:#1b2a3a;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0e1621;--card:#16222f;--ink:#e8eef5;--mute:#93a4b8;--acc:#5aa8f0;--acc2:#1b2d42;--line:#2a3a4c;--ok:#3ccf7b;--warn:#e0a63a;--bad:#ef6a5b;--soft:#1b2a3a;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px}
.top a,.top button{color:var(--mute);text-decoration:none;background:none;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px}
.top .sp{margin-left:auto}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;max-width:1040px;margin:0 auto;padding:10px 18px 40px;align-items:center}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.15;margin:8px 0 12px}
.hero p{color:var(--mute);max-width:46ch}
.roles{display:grid;gap:10px;margin-top:22px}
.roles div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.roles b{display:block}.roles span{color:var(--mute);font-size:13.5px}
.roles i{font-style:normal;font-size:24px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick label{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px;display:flex;gap:8px;align-items:center}
.pick input{width:auto}
.pick label:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.go{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:16px}
.go:disabled{opacity:.55;cursor:wait}
.msg{padding:9px 12px;border-radius:10px;font-size:13.5px;border:1px solid var(--line);background:var(--soft)}
.msg.bad{border-color:var(--bad);color:var(--bad)}.msg.ok{border-color:var(--ok)}.msg.warn{border-color:var(--warn)}
.note{color:var(--mute);font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none!important}
.ann{background:#fff4d6;color:#5b4300;border:1px solid #e6c36b;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
footer{text-align:center;font-size:12px;color:var(--mute);padding:14px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;gap:20px}.hero{order:2}}
</style>
</head>
<body>
<div class="top"><a href="index.html" id="home"></a><span class="sp"></span><a href="clinic.html?demo" id="demo"></a><button id="lang">TH/EN</button><button id="theme">◐</button></div>
<div class="wrap">
  <div class="hero">
    <span class="note" id="eyebrow"></span>
    <h1 id="h1"></h1>
    <p id="lead"></p>
    <div class="roles" id="roles"></div>
  </div>
  <div class="card">
    <div class="ann hide" id="ann"></div>
    <div class="msg warn hide" id="first"></div>
    <div class="tabs" id="tabs"><button data-t="in" class="on" id="tIn"></button><button data-t="up" id="tUp"></button></div>

    <form id="fIn" autocomplete="on">
      <label><span id="lEmail"></span><input id="inEmail" type="email" autocomplete="username" required></label>
      <label><span id="lPw"></span><input id="inPw" type="password" autocomplete="current-password" required></label>
      <button class="go" id="goIn"></button>
      <div class="msg hide" id="mIn" role="alert"></div>
      <p class="note"><a href="#" id="nForgot" style="color:var(--acc)"></a></p>
    </form>

    <form id="fUp" class="hide" autocomplete="on">
      <div class="pick" id="rolePick">
        <label><input type="radio" name="role" value="patient" checked><span id="rPat"></span></label>
        <label><input type="radio" name="role" value="doctor"><span id="rDoc"></span></label>
      </div>
      <label><span id="lName"></span><input id="upName" autocomplete="name" required></label>
      <label><span id="lEmail2"></span><input id="upEmail" type="email" autocomplete="username" required></label>
      <div class="two">
        <label><span id="lPw2"></span><input id="upPw" type="password" autocomplete="new-password" minlength="8" required></label>
        <label><span id="lPw3"></span><input id="upPw2" type="password" autocomplete="new-password" minlength="8" required></label>
      </div>
      <div id="xPat" class="two">
        <label><span id="lSex"></span><select id="upSex"><option value="M"></option><option value="F"></option></select></label>
        <label><span id="lAge"></span><input id="upAge" type="number" min="3" max="110"></label>
        <label><span id="lHt"></span><input id="upHt" type="number" min="90" max="220"></label>
        <label><span id="lDoc"></span><input id="upCode" placeholder="DR-XXXX"></label>
      </div>
      <div id="xDoc" class="two hide">
        <label><span id="lLic"></span><input id="upLic"></label>
        <label><span id="lOrg"></span><input id="upOrg"></label>
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink)"><input type="checkbox" id="upAgree" style="width:auto;margin-top:4px" required><span id="lAgree"></span></label>
      <button class="go" id="goUp"></button>
      <div class="msg hide" id="mUp" role="alert"></div>
    </form>
    <p class="note" style="margin-top:14px" id="nLocal"></p>
  </div>
</div>
<footer>ออกแบบโดย Tanachat S. (TANACHAT007) · ทีม MEDTHAI · 2026 · ไม่ใช่เครื่องมือแพทย์ที่ผ่านการรับรอง</footer>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script>
const $=id=>document.getElementById(id);
let lang=localStorage.sp_lang||'th';
const D={th:{home:'← หน้าแรก',demo:'ลองดูตัวอย่าง',eyebrow:'SPIRO · ระบบตรวจสมรรถภาพปอด',h1:'เข้าสู่ระบบ',lead:'บัญชีเดียวใช้ได้ตามบทบาท: ผู้ป่วยเป่าวัดเอง หมอตรวจคนไข้ ผู้ดูแลระบบจัดการผู้ใช้',
 r1:['🫁','ผู้ป่วย','เป่าวัดปอดเอง ดูประวัติ แนวโน้ม แชร์ผลกับแพทย์ด้วยรหัสแพทย์'],r2:['🩺','แพทย์ / บุคลากร','ตรวจผู้ป่วยทีละคน พิมพ์รายงาน ดูผลของผู้ป่วยที่ผูกบัญชี (ต้องรอผู้ดูแลอนุมัติ)'],r3:['🛠️','ผู้ดูแลระบบ','อนุมัติแพทย์ จัดการบัญชี ดูข้อมูลระบบ ตั้งค่า และเครื่องมือนักพัฒนา'],
 tIn:'เข้าสู่ระบบ',tUp:'สมัครใช้งาน',email:'อีเมล',pw:'รหัสผ่าน',goIn:'เข้าสู่ระบบ',forgot:'ลืมรหัสผ่าน? ส่งอีเมลรีเซ็ตให้',forgotLocal:'ลืมรหัสผ่าน: ติดต่อผู้ดูแลระบบให้ตั้งรหัสผ่านใหม่',resetSent:'ถ้าอีเมลนี้มีบัญชี ระบบส่งลิงก์ตั้งรหัสผ่านใหม่ให้แล้ว (ตรวจกล่องสแปมด้วย)',resetNeed:'กรอกอีเมลในช่องด้านบนก่อน',
 rPat:'🫁 ผู้ป่วย',rDoc:'🩺 แพทย์ / บุคลากร',name:'ชื่อ-สกุล',pw2:'รหัสผ่าน (≥ 8 ตัว)',pw3:'ยืนยันรหัสผ่าน',sex:'เพศ',male:'ชาย',female:'หญิง',age:'อายุ (ปี)',ht:'ส่วนสูง (ซม.)',doc:'รหัสแพทย์ (ถ้ามี)',lic:'เลขที่ใบประกอบวิชาชีพ',org:'สถานพยาบาล / โรงเรียน',
 agree:'ฉันเข้าใจว่านี่เป็นต้นแบบเพื่อการเรียนรู้/คัดกรอง ไม่ใช่เครื่องมือแพทย์ และข้อมูลในโหมดนี้เก็บในเบราว์เซอร์เครื่องนี้',goUp:'สมัครใช้งาน',
 local:'โหมดปัจจุบัน: เก็บข้อมูลในเบราว์เซอร์เครื่องนี้ ผู้ใช้ต่างเครื่องมองไม่เห็นกัน และรหัสผ่านไม่ใช่ระบบความปลอดภัยจริง ห้ามใส่ข้อมูลผู้ป่วยจริงจนกว่าจะย้ายไประบบคลาวด์',cloud:'🔒 รหัสผ่านเป็นความลับ: เก็บเฉพาะที่ Firebase Authentication (เข้ารหัสแบบ hash) เว็บนี้ไม่เก็บและไม่เห็นรหัสผ่านของคุณ ข้อมูลสุขภาพเป็นข้อมูลอ่อนไหว ผู้อื่นเห็นได้เฉพาะแพทย์ที่คุณเชื่อมไว้และแอดมิน',
 firstT:'ยังไม่มีผู้ดูแลระบบ: บัญชีแรกที่สมัครจะเป็นผู้ดูแลระบบ (แอดมิน) อัตโนมัติ',firstC:'ระบบยังไม่ได้ตั้งผู้ดูแล: เจ้าของโปรเจกต์ต้องกำหนดแอดมินคนแรกจากคอนโซล (ดู FIREBASE.md)',
 pwMismatch:'รหัสผ่านไม่ตรงกัน',pending:'สมัครแล้ว: บัญชีแพทย์ต้องรอผู้ดูแลระบบอนุมัติก่อนเข้าใช้งาน',okUp:'สมัครสำเร็จ กำลังเข้าสู่ระบบ…'},
en:{home:'← Home',demo:'Try an example',eyebrow:'SPIRO · LUNG FUNCTION SYSTEM',h1:'Sign in',lead:'One account, three roles: patients blow on their own, doctors test patients, admins run the system',
 r1:['🫁','Patient','Blow on your own, see history and trend, share results with your doctor via a doctor code'],r2:['🩺','Doctor / staff','Test patients, print reports, see linked patients (needs admin approval)'],r3:['🛠️','Admin','Approve doctors, manage accounts, system data, settings and developer tools'],
 tIn:'Sign in',tUp:'Register',email:'Email',pw:'Password',goIn:'Sign in',forgot:'Forgot password? E-mail me a reset link',forgotLocal:'Forgot password: ask an admin to set a new one',resetSent:'If this e-mail has an account, a reset link was sent (check spam)',resetNeed:'Type your e-mail above first',
 rPat:'🫁 Patient',rDoc:'🩺 Doctor / staff',name:'Full name',pw2:'Password (≥ 8 chars)',pw3:'Confirm password',sex:'Sex',male:'Male',female:'Female',age:'Age (y)',ht:'Height (cm)',doc:'Doctor code (optional)',lic:'Licence number',org:'Hospital / school',
 agree:'I understand this is a learning/screening prototype, not a medical device, and data in this mode stays in this browser.',goUp:'Register',
 local:'Current mode: data stays in this browser. Users on different devices cannot see each other and passwords are not real security. Do not enter real patient data until the cloud version exists.',cloud:'🔒 Passwords are secret: kept only inside Firebase Authentication (hashed). This site never stores or sees your password. Health data is sensitive: only your linked doctor and admins can see it.',
 firstT:'No admin yet: the first account registered becomes the admin automatically',firstC:'No admin is set yet: the project owner must promote the first admin from the console (see FIREBASE.md)',
 pwMismatch:'Passwords do not match',pending:'Registered: doctor accounts need admin approval before use',okUp:'Registered, signing in…'}};
const t=k=>D[lang][k];
const next=new URLSearchParams(location.search).get('next');
function apply(){
  document.documentElement.lang=lang;
  const m={home:'home',demo:'demo',eyebrow:'eyebrow',h1:'h1',lead:'lead',tIn:'tIn',tUp:'tUp',lEmail:'email',lEmail2:'email',lPw:'pw',goIn:'goIn',nForgot:'forgot',rPat:'rPat',rDoc:'rDoc',lName:'name',lPw2:'pw2',lPw3:'pw3',lSex:'sex',lAge:'age',lHt:'ht',lDoc:'doc',lLic:'lic',lOrg:'org',lAgree:'agree',goUp:'goUp',nLocal:SP.mode==='cloud'?'cloud':'local',nForgot:SP.mode==='cloud'?'forgot':'forgotLocal'};
  for(const k in m)$(k).textContent=t(m[k]);
  $('roles').innerHTML=['r1','r2','r3'].map(k=>`<div><i>${t(k)[0]}</i><p style="margin:0"><b>${t(k)[1]}</b><span>${t(k)[2]}</span></p></div>`).join('');
  [...$('upSex').options].forEach((o,i)=>o.textContent=t(['male','female'][i]));
  SP.Auth.hasAdmin().then(h=>{$('first').classList.toggle('hide',h);$('first').textContent=t(SP.mode==='cloud'?'firstC':'firstT')});
  SP.Settings.get().then(s=>{$('ann').classList.toggle('hide',!s.announcement);$('ann').textContent=s.announcement});
}
function tab(x){$('fIn').classList.toggle('hide',x!=='in');$('fUp').classList.toggle('hide',x!=='up');$('tIn').classList.toggle('on',x==='in');$('tUp').classList.toggle('on',x==='up')}
$('tIn').onclick=()=>tab('in');$('tUp').onclick=()=>tab('up');
document.querySelectorAll('input[name=role]').forEach(r=>r.onchange=()=>{const d=document.querySelector('input[name=role]:checked').value==='doctor';$('xDoc').classList.toggle('hide',!d);$('xPat').classList.toggle('hide',d)});
function show(id,txt,cls){const e=$(id);e.textContent=txt;e.className='msg '+(cls||'bad')}
function go(u){const safe=next&&/^[\w.-]+\.html(\?[\w=&.-]*)?$/.test(next)?next:SP.Auth.home(u);location.replace(safe)}
$('fIn').onsubmit=async e=>{e.preventDefault();$('goIn').disabled=true;try{const u=await SP.Auth.login($('inEmail').value,$('inPw').value);
  if(u.status==='pending'){await SP.Auth.logout();show('mIn',t('pending'),'warn')}else go(u)}catch(err){show('mIn',err.message)}$('goIn').disabled=false};
$('fUp').onsubmit=async e=>{e.preventDefault();if($('upPw').value!==$('upPw2').value){show('mUp',t('pwMismatch'));return}
  $('goUp').disabled=true;const role=document.querySelector('input[name=role]:checked').value;
  try{const extra=role==='doctor'?{license:$('upLic').value.trim(),org:$('upOrg').value.trim()}:{sex:$('upSex').value,age:+$('upAge').value||'',ht:+$('upHt').value||'',doctorCode:$('upCode').value.trim()};
    const u=await SP.Auth.register({email:$('upEmail').value,name:$('upName').value,password:$('upPw').value,role,extra});
    if(u.status==='pending'){await SP.Auth.logout();show('mUp',t('pending'),'warn')}else{show('mUp',t('okUp'),'ok');await SP.Auth.login($('upEmail').value,$('upPw').value);go(u)}}
  catch(err){show('mUp',err.message)}$('goUp').disabled=false};
$('nForgot').onclick=async e=>{e.preventDefault();if(SP.mode!=='cloud')return;const em=$('inEmail').value.trim();if(!em){show('mIn',t('resetNeed'),'warn');return}try{await SP.Auth.sendReset(em)}catch(err){}show('mIn',t('resetSent'),'ok')};
$('lang').onclick=()=>{lang=lang==='th'?'en':'th';localStorage.sp_lang=lang;apply()};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';localStorage.sp_th=r.dataset.theme};
if(localStorage.sp_th)document.documentElement.dataset.theme=localStorage.sp_th;
(async()=>{const u=await SP.Auth.init();if(u&&u.status==='active'&&!/[?&]switch/.test(location.search)){go(u);return}
  if(/[?&]register/.test(location.search))tab('up');apply()})();
</script>
<div class="credit-footer" style="text-align:center;font-size:12px;opacity:.7;padding:18px 0 28px">ออกแบบโดย Tanachat S. (TANACHAT007) · ทีม MEDTHAI · 2026</div>
</body>
</html>
